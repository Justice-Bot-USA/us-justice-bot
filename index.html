<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

    <!-- Google tag (gtag.js) — deferred to not block rendering -->
    <script defer src="https://www.googletagmanager.com/gtag/js?id=G-Z0965W94NE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Z0965W94NE');
    </script>
    <title>Justice Bot USA | Legal guidance for self-represented Americans</title>
    <meta name="description" content="Justice Bot USA is an AI-powered civic-guidance platform. Understand legal processes, fill in official court forms with your own answers, and request public records. Live in California and New York; other states coming soon. Legal information, not legal advice." />
    <meta name="author" content="Justice Bot USA" />
    <meta name="keywords" content="Justice Bot USA, AI legal help, legal guidance platform, public records request, FOIA generator, self-represented individuals, court forms, US legal information, pro se legal help" />

    <!-- Favicon and App Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="/icon-512.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://justicebot-usa.com/" />
    <meta property="og:title" content="Justice Bot USA" />
    <meta property="og:description" content="When people are expected to follow the law, ignorance should not be an option. Justice Bot USA helps you understand your legal situation. Information, not advice." />
    <meta property="og:image" content="https://justicebot-usa.com/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:site_name" content="Justice Bot USA" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://justicebot-usa.com/" />
    <meta name="twitter:title" content="Justice Bot USA" />
    <meta name="twitter:description" content="Legal information and official court forms. Live in California and New York; other states coming soon. Information, not legal advice." />
    <meta name="twitter:image" content="https://justicebot-usa.com/icon-512.png" />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <meta name="theme-color" content="#1e40af" />
    <link rel="canonical" href="https://justicebot-usa.com/" />

    <!-- hreflang: bilingual EN/ES support -->
    <!-- Both languages are served at the same URLs via client-side language toggle -->
    <link rel="alternate" hreflang="en" href="https://justicebot-usa.com/" />
    <link rel="alternate" hreflang="es" href="https://justicebot-usa.com/" />
    <link rel="alternate" hreflang="x-default" href="https://justicebot-usa.com/" />

    <!-- Open Graph locale alternates -->
    <meta property="og:locale:alternate" content="es_US" />
    
    <!-- Geographic Targeting -->
    <meta name="geo.region" content="US" />
    <meta name="geo.placename" content="United States" />
    
    <!-- Mobile App Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Justice Bot USA" />
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Quorex Solutions",
      "legalName": "Justice Bot Technologies Inc.",
      "brand": { "@type": "Brand", "name": "Justice Bot USA" },
      "description": "Legal information and official California and New York court forms, filled in from your own answers. Not a law firm and not legal advice.",
      "url": "https://justicebot-usa.com",
      "logo": "https://justicebot-usa.com/icon-512.png",
      "image": "https://justicebot-usa.com/icon-512.png",
      "areaServed": [{ "@type": "State", "name": "California" }, { "@type": "State", "name": "New York" }],
      "slogan": "Legal information, not legal advice."
    }
    </script>

    <!-- Structured Data - WebSite with SearchAction (fixed URL to /forms-library) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Justice Bot USA",
      "url": "https://justicebot-usa.com",
      "description": "Legal information and official court forms for California and New York. Other states coming soon.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://justicebot-usa.com/forms-library?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>



    <!-- Structured Data - SoftwareApplication (no aggregate rating: no verified reviews yet). The price is
         the free court forms and guides; the optional Toolkit plan is described on /pricing only. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Justice Bot USA",
      "applicationCategory": "LegalApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
