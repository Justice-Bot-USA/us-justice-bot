      "@context": "https://schema.org",

    }

    <!-- Structured Data - WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "US Justice Bot",
      "url": "https://justicebot-usa.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://justicebot-usa.com/case-analysis?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }

    <!-- Structured Data - FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "mainEntity": [
        {
          "@type": "Question",
          "name": "How much does US Justice Bot cost?",

            "@type": "Answer",

          }
        },

            "text": "US Justice Bot covers Family Law, Small Claims, Employment Law, Criminal Defense, Housing & Eviction, Civil Rights, Consumer Protection, Immigration, and Federal Court matters for all 50 US states."
          }
        },
        {
          "@type": "Question",
          "name": "Is US Justice Bot available in all US states?",
          "acceptedAnswer": {
            "@type": "Answer",
