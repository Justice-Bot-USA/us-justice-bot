    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LegalService",
      "name": "Justice Bot USA",      "description": "Justice Bot USA is an AI-powered civic-guidance platform that helps self-represented Americans understand legal processes, prepare documents, and request public records. Legal information, not legal advice.",
      "url": "https://justicebot-usa.com",
      "logo": "https://justicebot-usa.com/icon-512.png",
      "image": "https://justicebot-usa.com/icon-512.png",
      "areaServed": { "@type": "Country", "name": "United States" },
      "serviceType": ["Legal Information", "Legal Document Preparation", "Court Form Assistance", "Public Records Requests", "Case Merit Analysis"],
      "priceRange": "$",
      "slogan": "Legal information, not legal advice."
    }
    </script>

    <!-- Structured Data - WebSite with SearchAction (fixed URL to /forms-library) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Justice Bot USA",
      "url": "https://justicebot-usa.com",
      "description": "Justice Bot USA. AI-powered legal guidance for all 50 US states.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://justicebot-usa.com/forms-library?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data - FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How much does Justice Bot USA cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Justice Bot USA offers affordable plans starting at $9.99/month or $79/year for unlimited access, plus $4.99 per individual form. This is a fraction of typical attorney fees which can cost $200-$500 per hour."
          }
        },
        {
          "@type": "Question",
          "name": "What legal areas does Justice Bot USA cover?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Justice Bot USA covers Immigration, Family Law, Small Claims, Employment, Workers Compensation, Human Rights, Housing & Eviction, Civil Rights, Criminal Defense, and more for all 50 US states."
          }
        },
        {
          "@type": "Question",
          "name": "Is Justice Bot USA available in all US states?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Justice Bot USA provides state-specific legal guidance, official court forms, and detailed procedures for all 50 US states."
          }
        },
        {
          "@type": "Question",
          "name": "How does the AI Merit Score Analysis work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our AI analyzes your case documents and description to provide a merit score (0-100), identifies strengths and weaknesses, suggests evidence to gather, recommends required forms, estimates settlement ranges, and provides a step-by-step legal pathway tailored to your state and county."
          }
        },
        {
          "@type": "Question",
          "name": "Can Justice Bot USA replace an attorney?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Justice Bot USA provides legal information and document preparation, not legal advice. For complex matters, consult a licensed attorney. For common issues like small claims, simple divorces, and basic contracts, our AI can help you represent yourself effectively."
          }
        }
      ]
    }
    </script>
